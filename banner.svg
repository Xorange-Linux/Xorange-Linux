<svg xmlns="http://w3.org" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="65%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Main Card -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#bg)" stroke="url(#accent)" stroke-width="3" />

  <!-- Left Orange Accent Bar -->
  <rect x="36" y="42" width="6" height="136" rx="3" fill="url(#accent)" />

  <!-- Decorative Geometric Rings on Right -->
  <circle cx="810" cy="110" r="95" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.18" />
  <circle cx="810" cy="110" r="65" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.28" />
  <circle cx="810" cy="110" r="35" fill="#f97316" fill-opacity="0.12" />

  <!-- Tagline Pill -->
  <rect x="60" y="42" width="195" height="26" rx="13" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1" />
  <text x="157" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="1.2">ARCH LINUX • LEMON</text>

  <!-- Main Title -->
  <text x="60" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Xorange-Linux</text>

  <!-- Subtitle -->
  <text x="60" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa">Lightweight, fast, and user-friendly — powered by Pacman.</text>
</svg>
