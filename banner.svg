<svg fill="none" viewBox="0 0 900 260" width="900" height="260" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        @keyframes pulseGlow {
          0%, 100% { box-shadow: 0 0 25px rgba(249, 115, 22, 0.35); border-color: #f97316; }
          50% { box-shadow: 0 0 45px rgba(234, 88, 12, 0.65); border-color: #fb923c; }
        }
        @keyframes slideUp {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .hero-box {
          box-sizing: border-box;
          width: 100%;
          height: 240px;
          margin: 10px 0;
          padding: 32px 40px;
          border-radius: 18px;
          background: radial-gradient(circle at top right, #431407 0%, #18181b 55%, #09090b 100%);
          border: 2px solid #f97316;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          color: #ffffff;
          display: flex;
          flex-direction: column;
          justify-content: center;
          animation: pulseGlow 4s infinite ease-in-out;
        }
        .pill {
          display: inline-block;
          width: fit-content;
          padding: 4px 12px;
          border-radius: 999px;
          background: rgba(249, 115, 22, 0.15);
          border: 1px solid #f97316;
          color: #fb923c;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          margin-bottom: 12px;
        }
        .title {
          font-size: 46px;
          font-weight: 900;
          letter-spacing: -1px;
          margin: 0 0 8px 0;
          background: linear-gradient(90deg, #ffffff 0%, #fdba74 60%, #f97316 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: slideUp 0.8s ease-out;
        }
        .subtitle {
          font-size: 18px;
          color: #a1a1aa;
          margin: 0;
          font-weight: 400;
        }
        .highlight {
          color: #f97316;
          font-weight: 600;
        }
      </style>

      <div class="hero-box">
        <div class="pill">● Arch Linux Base • Rolling Release</div>
        <h1 class="title">Xorange-Linux</h1>
        <p class="subtitle">
          Fast, minimal, and built for real hardware — powered by <span class="highlight">Pacman</span>.
        </p>
      </div>
    </div>
  </foreignObject>
</svg>
