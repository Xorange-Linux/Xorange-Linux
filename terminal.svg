<svg fill="none" viewBox="0 0 900 240" width="900" height="240" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        .window {
          box-sizing: border-box;
          width: 100%;
          height: 225px;
          border-radius: 14px;
          background: #0d1117;
          border: 1px solid #30363d;
          font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
          overflow: hidden;
          box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }
        .titlebar {
          background: #161b22;
          padding: 10px 16px;
          border-bottom: 1px solid #30363d;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .win-title { color: #8b949e; font-size: 12px; margin-left: 8px; }
        .body { padding: 18px 22px; font-size: 14px; line-height: 1.65; color: #e6edf3; }
        .prompt { color: #f97316; font-weight: bold; }
        .cmd { color: #ffffff; }
        .key { color: #fb923c; font-weight: bold; }
        .val { color: #d4d4d8; }
      </style>

      <div class="window">
        <div class="titlebar">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="win-title">motochann@xorange-linux: ~</span>
        </div>
        <div class="body">
          <div><span class="prompt">[motochann@xorange ~]$</span> <span class="cmd">fastfetch --pipe</span></div>
          <div><span class="key">OS:</span> <span class="val">Xorange-Linux x86_64 (Arch Linux Base)</span></div>
          <div><span class="key">Codename:</span> <span class="val">Lemon (formerly Orange)</span></div>
          <div><span class="key">Packages:</span> <span class="val">pacman</span></div>
          <div><span class="key">Dev Machine:</span> <span class="val">Intel Core i3-3217U (1.80 GHz)</span></div>
          <div><span class="key">Next Goal:</span> <span class="val">Linux From Scratch (LFS)</span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
